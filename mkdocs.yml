# Configuración del sitio del curso (Material for MkDocs).
# Vista previa local:  pip install -r requirements.txt  y  mkdocs serve
# El bloque "nav" del final lo genera scripts/generar.py: no lo edites a mano.

site_name: Formación Integral en IA
site_description: >-
  Curso abierto y autodidacta de inteligencia artificial, de los fundamentos a agentes,
  MCP y automatización, para personas que programan y no saben IA.
site_url: https://caminosmarina.github.io/curso-ia/
repo_url: https://github.com/CaminosMarina/curso-ia
repo_name: curso-ia
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Contenido bajo CC BY-SA 4.0 · Código bajo MIT

theme:
  name: material
  language: es
  icon:
    logo: material/school-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Usar modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Usar modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Usar el modo del sistema
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/extra.css

hooks:
  - hooks/callouts.py

plugins:
  - search:
      lang: es

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# ── Menú del sitio: generado por scripts/generar.py, no editar a mano ──
