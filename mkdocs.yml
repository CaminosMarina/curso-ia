# Configuración del sitio del curso (Material for MkDocs).
# Vista previa local:  pip install -r requirements.txt  y  mkdocs serve
# El bloque "nav" del final lo genera scripts/generar.py: no lo edites a mano.

site_name: Formación Integral en IA
site_description: >-
  Curso abierto y autodidacta de inteligencia artificial, de los fundamentos a agentes,
  MCP y automatización, para personas que programan y no saben IA.
site_url: https://caminosmarina.github.io/curso-ia/
repo_url: https://github.com/CaminosMarina/curso-ia
repo_name: curso-ia
edit_uri: edit/main/docs/
docs_dir: docs
site_author: Marina Caminos
copyright: © 2026 Marina Caminos · Contenido bajo CC BY-SA 4.0 · Código bajo MIT

theme:
  name: material
  custom_dir: overrides
  language: es
  favicon: assets/favicon.svg
  icon:
    logo: curso/logo
    repo: fontawesome/brands/github
  font:
    text: Lexend
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/coffee-outline
        name: "Modo Cortado: menos brillo"
    - scheme: cortado
      primary: custom
      accent: custom
      toggle:
        icon: material/coffee
        name: "Modo Espresso: oscuro"
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/coffee-to-go-outline
        name: "Modo Lofi: café de medianoche"
    - scheme: lofi
      primary: custom
      accent: custom
      toggle:
        icon: material/headphones
        name: "Modo Latte: claro"
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.tooltips

extra_css:
  - assets/estilo-latte.css
  - assets/curso.css

extra_javascript:
  - assets/curso.js

hooks:
  - hooks/callouts.py
  - hooks/curso.py

plugins:
  - search:
      lang: es

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# ── Menú del sitio: generado por scripts/generar.py, no editar a mano ──
